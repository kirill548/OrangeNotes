# Linux Docker runner; macOS requires a logged-in shell runner with granted permissions.
stages: [test, package]
linux-tests:
  image: python:3.12-bookworm
  stage: test
  variables:
    QT_QPA_PLATFORM: xcb
  before_script:
    - apt-get update && apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 dbus-x11 libnotify-bin libglib2.0-bin dunst
    - python -m pip install -r requirements-build.txt
  script:
    - xvfb-run -a python -m unittest discover -s tests
    - bash tools/test_linux_notifications.sh
    - python tools/build.py
    - xvfb-run -a python tools/smoke_portable.py dist/OrangeNotes/OrangeNotes
    - useradd --create-home --shell /bin/bash orange-packager
    - chown -R orange-packager:orange-packager dist
    - runuser -u orange-packager -- python tools/package_deb.py dist/OrangeNotes dist/OrangeNotes-Linux-x64.deb
    - runuser -u orange-packager -- python tools/verify_deb.py dist/OrangeNotes-Linux-x64.deb
  artifacts:
    paths: [dist/OrangeNotes-*.tar.gz, dist/OrangeNotes-*.deb]
macos-native-notifications:
  stage: package
  tags: [macos, orangenotes-notifications]
  when: manual
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
  script:
    - python3 -m pip install -r requirements-build.txt
    - python3 tools/build.py --clean
    - bash tools/test_mac_bundle.sh
    - dist/OrangeNotes.app/Contents/MacOS/OrangeNotes --notification-self-test
  artifacts:
    when: always
    paths: [mac-native-notifications.log, dist/OrangeNotes-*.zip, dist/OrangeNotes-*.dmg]
