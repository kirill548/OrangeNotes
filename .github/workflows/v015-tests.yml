name: v0.1.5 knowledge graph regression
on:
  push:
    branches: [v0.1.5-dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v015-knowledge-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            qt_platform: windows
          - os: ubuntu-latest
            architecture: x64
            qt_platform: offscreen
          - os: macos-15-intel
            architecture: x64
            qt_platform: cocoa
          - os: macos-15
            architecture: arm64
            qt_platform: cocoa
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libgl1
      - run: python -m pip install -r requirements-build.txt pytest pytest-subtests pytest-timeout
      - name: Tool contracts and malformed output sandbox
        run: python -m pytest tests/test_tool_calling.py tests/test_tool_schema.py -v
      - name: Voice input mock and fallback contracts
        run: python -m pytest tests/test_local_stt.py tests/test_audio_capture.py tests/test_stt_platform_contract.py tests/test_companion_voice.py -v
      - name: Wiki links, graph UI and workspace isolation
        run: python -m pytest tests/test_knowledge_graph.py tests/test_knowledge_graph_ui.py tests/test_knowledge_graph_ai.py -v
      - name: Synthetic index and force layout benchmarks
        run: |
          python -m tools.benchmark_knowledge_graph --notes 550 --output knowledge-benchmark.json
          python -m tools.benchmark_graph_layout --nodes 500 1000 --output layout-benchmark.json
      - name: Full regression (live model qualification is separate)
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: python -m pytest tests/ --timeout=90 --timeout-method=thread --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v015-regression-${{ matrix.os }}
          path: |
            regression.xml
            knowledge-benchmark.json
            layout-benchmark.json

