name: Cross-platform stability and P2P regression
on:
  push:
    branches: [main, v0.2.0-dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v020-p2p-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            architecture: x64
            qt_platform: windows
          - os: ubuntu-latest
            architecture: x64
            qt_platform: offscreen
          - os: macos-15-intel
            architecture: x64
            qt_platform: cocoa
          - os: macos-15
            architecture: arm64
            qt_platform: cocoa
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
      ORANGE_NOTES_TEST_MDNS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Linux Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libgl1
      - run: python -m pip install -r requirements-build.txt -r requirements-network-test.txt pytest pytest-subtests pytest-timeout
      - name: P2P deltas, mobile AI relay, UUID copy and v0.1.5 compatibility
        run: python -m pytest tests/test_p2p_sync.py tests/test_p2p_identity.py tests/test_p2p_discovery.py tests/test_p2p_mdns.py tests/test_p2p_store.py tests/test_p2p_network.py tests/test_p2p_node.py tests/test_p2p_export.py tests/test_mobile_ai_relay.py -v --timeout=90 --timeout-method=thread --junitxml=p2p.xml
      - name: Full regression (live model qualification is separate)
        env:
          QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
        run: python -m pytest tests/ --timeout=90 --timeout-method=thread --junitxml=regression.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v020-p2p-${{ matrix.os }}
          path: |
            regression.xml
            p2p.xml
