name: v0.1.4 native portable STT and packages
on:
  workflow_dispatch:
  push:
    branches: [ci/v014-dev]
    paths:
      - .github/workflows/v014-portable-qa.yml
      - app/services/stt_installer.py
      - tools/stt_native_smoke.py
      - tools/build.py
      - tests/test_stt*.py
      - tests/test_audio*.py
      - app/services/app_paths.py
      - app/services/audio_capture.py
concurrency:
  group: portable-stt-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux-x64
            architecture: x64
            qt_platform: offscreen
          - os: macos-15-intel
            name: macOS-Intel
            architecture: x64
            qt_platform: cocoa
          - os: macos-latest
            name: macOS-AppleSilicon
            architecture: arm64
            qt_platform: cocoa
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qt_platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Linux multimedia and display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-sync1 libxcb-xfixes0 libx11-xcb1 libfontconfig1 libdbus-1-3 libgl1 libpulse0 libasound2t64 xvfb
      - run: python -m pip install -r requirements-build.txt pytest pytest-subtests pytest-timeout cmake
      - name: Verify Linux Qt shared libraries
        if: runner.os == 'Linux'
        run: python tools/verify_qt_libraries.py
      - name: Diagnose macOS build tools
        if: runner.os == 'macOS'
        run: python tools/diagnose_whisper_macos.py --output work/portable-stt-qa/macos-prerequisites.json
      - name: Audio fallback contracts and full regression
        run: python -m pytest tests/ --timeout=90 --timeout-method=thread --junitxml=work/portable-stt-qa/pytest.xml
      - name: Install verified Whisper and execute native synthetic inference
        run: python tools/stt_native_smoke.py --output work/portable-stt-qa/native-stt.json
      - name: Provision pinned AppImage tool
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl --fail --location --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool.AppImage"
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/appimagetool.AppImage" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/appimagetool.AppImage"
          cd "$RUNNER_TEMP"
          ./appimagetool.AppImage --appimage-extract > /dev/null
          OFFSET=$(./appimagetool.AppImage --appimage-offset)
          head -c "$OFFSET" ./appimagetool.AppImage > ./appimage-runtime
          echo "APPIMAGETOOL_PATH=$RUNNER_TEMP/squashfs-root/AppRun" >> "$GITHUB_ENV"
          echo "APPIMAGE_RUNTIME_FILE=$RUNNER_TEMP/appimage-runtime" >> "$GITHUB_ENV"
      - name: Build native Lite package
        run: python tools/build.py --clean --edition lite
      - name: Linux frozen GUI startup
        if: runner.os == 'Linux'
        run: xvfb-run -a python tools/smoke_portable.py dist/OrangeNotes/OrangeNotes
      - name: macOS frozen GUI startup
        if: runner.os == 'macOS'
        run: python tools/smoke_portable.py dist/OrangeNotes.app/Contents/MacOS/OrangeNotes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-stt-qa-${{ matrix.name }}
          path: work/portable-stt-qa/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: OrangeNotes-v014-Lite-${{ matrix.name }}
          path: |
            dist/OrangeNotes-*.tar.gz
            dist/OrangeNotes-*.AppImage
            dist/OrangeNotes-*.zip
            dist/OrangeNotes-*.dmg
          if-no-files-found: error
