name: Native macOS device validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos-notifications:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - name: Real bundled UserNotifications test
        run: bash tools/test_mac_bundle.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-macOS-${{ matrix.os }}
          path: mac-native-notifications.log
          if-no-files-found: error
